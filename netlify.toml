[build]
  command = "npm run build"
  publish = "dist"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# Every /api request goes to the one API function.
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/api/:splat"
  status = 200
  force = true

# Lets links like /dashboard/alerts open directly.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
